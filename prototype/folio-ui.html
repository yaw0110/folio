<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Folio UI prototype</title>
  <style>
    :root{--ink:#18212b;--muted:#768292;--line:#e6e9ed;--paper:#fffdfa;--accent:#ef6b4a;--soft:#f4f1ed;font:14px/1.5 Inter,ui-sans-serif,system-ui,sans-serif;color:var(--ink);background:#e9edf0}
    *{box-sizing:border-box}body{margin:0;min-height:100vh}button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}.app{min-height:100vh}.top{height:64px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:-.03em;font-size:20px}.brand i{display:inline-block;width:8px;height:8px;background:var(--accent);border-radius:50%;margin:0 7px 2px 0}.top-right{display:flex;align-items:center;gap:14px;color:var(--muted)}.save{padding:8px 13px;background:var(--ink);color:#fff;border-radius:7px}.layout{display:grid;grid-template-columns:220px minmax(320px,1fr) minmax(360px,1.2fr);min-height:calc(100vh - 64px)}.rail{padding:24px 16px;background:#f7f8f9;border-right:1px solid var(--line)}.rail h3,.pane-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 10px}.doc{padding:11px 12px;border-radius:8px;background:#fff;box-shadow:0 1px 2px #18212b0d;margin-bottom:24px}.doc b{display:block;font-size:13px}.doc small{color:var(--muted)}.nav button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:7px;color:#617080}.nav button.active{background:#e9e2dc;color:var(--ink);font-weight:700}.templates{margin-top:28px}.template{display:flex;align-items:center;gap:8px;padding:8px 6px;color:#617080}.swatch{width:20px;height:20px;border-radius:5px;border:1px solid #d6d9dd}.editor{padding:34px 38px;background:#fff}.editor-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:26px}.editor h1{font:700 30px/1.15 Georgia,serif;letter-spacing:-.03em;margin:0}.meta{color:var(--muted);font-size:12px;margin-top:7px}.md{max-width:640px;font:16px/1.8 Georgia,serif;white-space:pre-wrap;outline:none}.md .line{padding:2px 0}.md .hash{color:var(--accent);font-weight:700}.editor-foot{margin-top:34px;color:var(--muted);font-size:12px;display:flex;gap:14px}.preview-wrap{padding:28px 34px;background:#f3f1ee}.preview-head{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:18px}.preview{max-width:690px;margin:auto;background:var(--paper);min-height:calc(100vh - 150px);padding:54px 62px;box-shadow:0 10px 35px #18212b12}.preview h1{font:700 34px/1.15 Georgia,serif;margin:0 0 18px}.preview .kicker{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.preview p{font:17px/1.8 Georgia,serif;color:#3b4650}.preview .rule{height:1px;background:var(--line);margin:28px 0}.pill{padding:6px 10px;background:#fff;border:1px solid var(--line);border-radius:99px}.switcher{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:7px 10px 7px 14px;background:#17212b;color:#fff;border-radius:99px;box-shadow:0 8px 25px #17212b33;z-index:4}.switcher button{width:28px;height:28px;color:#b7c2cc;border-radius:50%}.switcher button:hover{background:#334250;color:#fff}.switcher strong{font-size:12px;min-width:130px;text-align:center}.badge{color:#71d6ae;font-size:11px;margin-left:4px}
    /* Variant B: a reading canvas with a compact inspector. */
    .b{background:#12181f;color:#e8edf0}.b .top{background:#12181f;border-color:#2b343d;color:#e8edf0}.b .top-right{color:#9ba7b1}.b .save{background:#e8edf0;color:#12181f}.b .layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;min-height:calc(100vh - 64px)}.b .editor{padding:30px 6vw;background:#1b232c}.b .editor-head{max-width:760px;margin:0 auto 26px}.b .editor h1{color:#f5f2ed}.b .md{max-width:760px;margin:auto;color:#c9d1d7}.b .preview-wrap{padding:30px;background:#202a34;border-left:1px solid #303b45;overflow:auto}.b .preview-head{color:#a5b1bb}.b .preview{min-height:auto;padding:34px 30px;box-shadow:none;border-radius:5px}.b .rail{display:none}.b .inspector{padding:24px;background:#141b22;border-top:1px solid #2b343d}.b .inspector h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#8e9ca7}.b .control{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #2b343d;color:#b8c2ca}.b .control span:last-child{color:#f5f2ed}.b .switcher{background:#f5f2ed;color:#17212b}.b .switcher button{color:#536270}.b .switcher button:hover{background:#dfe4e7;color:#17212b}
    /* Variant C: a calm, three-column production desk. */
    .c{background:#f8f7f4}.c .top{background:#24342f;color:#f7f5ee;border:0}.c .top-right{color:#c0cdc7}.c .save{background:#c4f27b;color:#203126}.c .layout{grid-template-columns:270px minmax(300px,1fr) minmax(320px,1fr) 260px;min-height:calc(100vh - 64px);gap:0}.c .rail{background:#e9eee8;border:0;padding:28px 20px}.c .doc{background:#f8f7f4;box-shadow:none;border:1px solid #dbe2da}.c .nav button.active{background:#d1e5c9}.c .editor{background:#f8f7f4;padding:38px 42px}.c .editor h1{font-family:ui-sans-serif;font-size:28px}.c .md{font-family:ui-sans-serif;font-size:15px;line-height:1.9}.c .preview-wrap{background:#e3e9e2;padding:28px 22px}.c .preview{padding:42px 36px;min-height:calc(100vh - 146px);box-shadow:0 4px 18px #29402b18}.c .preview h1{font-family:ui-sans-serif;font-size:30px}.c .preview p{font-family:ui-sans-serif;font-size:15px;line-height:1.9}.c .inspector{background:#fff;padding:28px 22px;border-left:1px solid #e0e5df}.c .inspector h3{font-size:11px;letter-spacing:.12em;color:#718177;text-transform:uppercase}.c .control{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #e8ece7;color:#617065}.c .control span:last-child{color:#24342f;font-weight:700}.c .switcher{background:#24342f}
    .a .layout{grid-template-columns:1fr 1fr;gap:14px;padding:18px 28px;background:#f1f3f5}.a .editor,.a .preview-wrap{border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:0}.a .editor{background:#fff}.a .editor-head,.a .preview-head{padding:16px 20px;margin:0;border-bottom:1px solid var(--line);background:#fff}.a .editor h1{font:700 24px/1.2 ui-sans-serif}.a .md{max-width:none;padding:20px 22px;font:14px/1.85 ui-monospace,SFMono-Regular,monospace;min-height:calc(100vh - 190px)}.a .editor-foot{padding:14px 20px;margin:0;border-top:1px solid var(--line)}.a .preview-wrap{background:#e8ebef}.a .preview-head{color:var(--muted)}.a .preview{margin:24px auto;min-height:calc(100vh - 190px);padding:44px 42px;border-radius:8px;box-shadow:0 8px 24px #18212b18}.a .preview h1{font-size:30px}
    @media(max-width:900px){.layout,.b .layout,.c .layout{grid-template-columns:1fr}.rail,.inspector{display:none}.preview-wrap{padding:18px}.preview{min-height:auto;padding:32px 24px}.editor{padding:26px 22px}}
  </style>
</head>
<body>
  <div id="app"></div>
  <nav class="switcher" aria-label="原型方案切换"><button id="prev" aria-label="上一个方案">←</button><strong id="which"></strong><button id="next" aria-label="下一个方案">→</button></nav>
  <script>
    const variants={A:'A · Studio 双栏工作台',B:'B · Canvas 阅读画布',C:'C · Desk 生产工作台'};
    const md=['# 春天的第一封信','', '写给正在重新开始的人。', '', '慢一点，也没有关系。'].map((x,i)=>`<div class="line ${i===0?'hash':''}">${x||'&nbsp;'}</div>`).join('');
    const base=(extra='')=>`<header class="top"><div class="brand"><i></i>folio</div><div class="top-right"><span>已保存 · 刚刚</span><button class="save">导出 HTML</button></div></header><main class="layout">${extra}</main>`;
    function focus(){return `<section class="editor"><div class="editor-head"><div><h1>Markdown</h1><div class="meta">spring-letter.md · 已保存</div></div><button class="pill">载入示例</button></div><div class="md" contenteditable="true">${md}</div><div class="editor-foot"><span>⌘ S 保存</span><span>⌘ ↵ 预览</span><span>字数 184</span></div></section><section class="preview-wrap"><div class="preview-head"><span>公众号预览</span><span><b class="badge">✓ 平台合规</b>　适应　小屏 375　标准 402</span></div><article class="preview"><div class="kicker">Letter no. 01</div><h1>春天的第一封信</h1><div class="rule"></div><p>写给正在重新开始的人。</p><p>慢一点，也没有关系。</p></article></section>`}
    function canvas(){return `<section class="editor"><div class="editor-head"><div><h1>春天的第一封信</h1><div class="meta">spring-letter.md · 已保存</div></div><button class="pill">预览中</button></div><div class="md" contenteditable="true">${md}</div></section><section class="preview-wrap"><div class="preview-head"><span>PREVIEW</span><span>滚动查看成品</span></div><article class="preview"><div class="kicker">Letter no. 01</div><h1>春天的第一封信</h1><div class="rule"></div><p>写给正在重新开始的人。</p><p>慢一点，也没有关系。</p></article><div class="inspector"><h3>快速调整</h3><div class="control"><span>字体</span><span>Georgia⌄</span></div><div class="control"><span>正文色</span><span>#3B4650</span></div><div class="control"><span>段落间距</span><span>1.8</span></div></div></section>`}
    function desk(){return `<aside class="rail"><h3>Folio / 本地文件</h3><div class="doc"><b>spring-letter.md</b><small>已保存 · 184 字</small></div><div class="nav"><button class="active">内容</button><button>样式</button><button>交付</button></div><div class="templates"><h3>最近模板</h3><div class="template"><span class="swatch" style="background:#d1e5c9"></span>森林绿</div><div class="template"><span class="swatch" style="background:#e8d9c9"></span>暖沙色</div></div></aside><section class="editor"><div class="editor-head"><div><h1>内容</h1><div class="meta">Markdown 是唯一内容源</div></div><button class="pill">打开文件</button></div><div class="md" contenteditable="true">${md}</div></section><section class="preview-wrap"><div class="preview-head"><span>成品预览</span><span>HTML 就绪</span></div><article class="preview"><div class="kicker">Letter no. 01</div><h1>春天的第一封信</h1><div class="rule"></div><p>写给正在重新开始的人。</p><p>慢一点，也没有关系。</p></article></section><aside class="inspector"><h3>样式</h3><div class="control"><span>模板</span><span>森林绿⌄</span></div><div class="control"><span>标题字号</span><span>30 px</span></div><div class="control"><span>正文宽度</span><span>640 px</span></div><h3 style="margin-top:30px">交付</h3><button class="save" style="width:100%;margin-top:8px">导出 HTML</button><button class="pill" style="width:100%;margin-top:8px">复制预览</button></aside>`}
    function render(){let key=new URLSearchParams(location.search).get('variant')||'A';if(!variants[key])key='A';document.body.className=key.toLowerCase();document.querySelector('#app').innerHTML=base(key==='A'?focus():key==='B'?canvas():desk());document.querySelector('#which').textContent=variants[key];document.querySelector('#prev').onclick=()=>go(key,-1);document.querySelector('#next').onclick=()=>go(key,1)}
    function go(key,delta){const keys=Object.keys(variants),next=keys[(keys.indexOf(key)+delta+keys.length)%keys.length];history.replaceState({},'',`?variant=${next}`);render()}
    addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==='ArrowLeft')go(new URLSearchParams(location.search).get('variant')||'A',-1);if(e.key==='ArrowRight')go(new URLSearchParams(location.search).get('variant')||'A',1)});
    render();
  </script>
</body>
</html>
