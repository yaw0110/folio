name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check tag version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: macos
            command: npm run dist:mac -- --publish never
          - os: windows-latest
            name: windows
            command: npm run dist:win -- --publish never
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: folio-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find release -maxdepth 1 -type f \( \
            -name '*.dmg' -o -name '*.pkg' -o -name '*.exe' -o -name '*.msi' \
            -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.tar.gz' \
          \) -print0)
          ((${#assets[@]})) || { echo 'No installable release assets found'; exit 1; }
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${assets[@]}" \
            --verify-tag --generate-notes --title "Folio $GITHUB_REF_NAME"
